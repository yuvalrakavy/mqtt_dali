# Logging & tracing configuration for the mqtt_dali bridge.
#
# Auto-discovered by tracing-init: searched upward from the process working
# directory. The systemd unit runs with WorkingDirectory=/home/<user>, so on
# the Pi this file is deployed next to the binary (install_to_pi copies it).
#
# Fleet policy: ~/Documents/Projects/Store/docs/guides/logging-policy.md
# (ERROR = code fix warranted; WARN = zero-at-idle, every WARN carries kind).

[logging]
# "+g+o" ADDS GELF and OpenTelemetry to the destinations the binary already
# configures (file + optional console). Use plain letters (e.g. "fgo") to
# replace them instead.
destination = "+g+o"

[logging.gelf]
# logmon-broker GELF ingest (UDP). NOTE: an unresolvable host fails tracing
# init at startup and the bridge will not start — keep this pointing at a
# name/IP resolvable from THIS site, or drop the "+g" modifier above.
address = "yuvals-mac-studio.villarakavy.local:12201"

[logging.otel]
# logmon-broker OTLP ingest — exports spans. Required for distributed traces:
# the MQTT v5 traceparent propagation only lights up when the "o" destination
# installs the OpenTelemetry layer.
endpoint = "http://yuvals-mac-studio.villarakavy.local:4318"
transport = "http"
