# Logging & tracing configuration for the mqtt_dali bridge.
#
# Auto-discovered by tracing-init: searched upward from the process working
# directory. The systemd unit runs with WorkingDirectory=/home/<user>, so on
# the Pi this file is deployed next to the binary (install_to_pi copies it).
#
# Fleet policy: ~/Documents/Projects/Store/docs/guides/logging-policy.md
# (ERROR = code fix warranted; WARN = zero-at-idle, every WARN carries kind).

[logging]
# BridgeKit always initializes tracing-init. "+g+o" adds GELF/OTel to its
# built-in file/GELF destinations. --log-config selects an explicit file;
# LOG_DESTINATION overrides destination selection. v2 uses RUST_LOG rather
# than the legacy --console/--log/--filter flags. Destinations are lossy so
# a stalled sink cannot hold the service. See docs/running-v2.md.
destination = "+g+o"
# Telemetry must never prevent the bridge from starting: a destination that
# fails to initialize (e.g. unresolvable GELF host) is skipped with a stderr
# note + a SKIPPED entry in the startup summary, instead of failing init.
on_destination_error = "skip"

[logging.gelf]
# logmon-broker GELF ingest (UDP). Adjust per site; with
# on_destination_error = "skip" a wrong/unresolvable host costs only the
# GELF destination, not the bridge.
address = "yuvals-mac-studio.villarakavy.local:12201"

[logging.otel]
# logmon-broker OTLP ingest — exports spans. Required for distributed traces:
# continuing exported operation spans needs the "o" OpenTelemetry layer.
# Valid incoming MQTT traceparent metadata is preserved even without it.
endpoint = "http://yuvals-mac-studio.villarakavy.local:4318"
transport = "http"
