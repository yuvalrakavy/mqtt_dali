[[control]]
name = "dt8_enable_is_not_consumed"
file = "src/emulator/model.rs"
anchor = "bus.enabled_type.take()"
replacement = "bus.enabled_type"
target = "command"
argv = ["cargo","nextest","run","--offline","--target","aarch64-apple-darwin","--lib","-E","test(emulator_dt8_enable)"]
expect_text = "DT8 selection survived its command"

