[[control]]
name = "frozen_service_routing_accepts_edits"
file = "src/service/routing.rs"
anchor = '''_ => {
            return Err(ServiceError::Rejected(
                "routing is not ready for this operation".into(),
            ))
        }'''
replacement = "_ => {}"
target = "command"
argv = ["cargo","nextest","run","--offline","--target","aarch64-apple-darwin","--lib","-E","test(routing_is_frozen_until_runtime_is_attached_and_while_a_save_is_uncertain)"]
expect_text = "frozen routing admitted a mutation"

