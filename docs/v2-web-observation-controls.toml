[[control]]
name = "web_snapshot_regresses_to_inventory_only_size_budget"
file = "src/web/handlers.rs"
anchor = "pub(super) const SNAPSHOT_BYTES: usize = 4 * 1024 * 1024;"
replacement = "pub(super) const SNAPSHOT_BYTES: usize = 1024 * 1024;"
target = "command"
argv = ["cargo","nextest","run","--offline","--target","aarch64-apple-darwin","--lib","-E","test(web_observed_dense_valid)"]
expect_text = "dense valid inventory and shared observations exceed HTTP snapshot budget"

