[[control]]
name = "fresh_boot_discards_completed_boundary"
file = "src/service/hat.rs"
anchor = ".is_some_and(|job| job.1 == JobKind::Query)"
replacement = ".is_some_and(|_| true)"
target = "command"
argv = ["cargo","nextest","run","--offline","--target","aarch64-apple-darwin","--lib","-E","test(fresh_boot_keeps_a_completed_receive_boundary_instead_of_requiring_another_reboot)"]
expect_text = "fresh Boot discarded its already-completed receive boundary"

[[control]]
name = "serial_opener_escapes_runtime_ownership"
file = "src/atx/serial.rs"
anchor = "let worker = tokio::task::spawn_blocking(open);"
replacement = '''let (send,receive)=tokio::sync::oneshot::channel();
        std::thread::spawn(move || {let _=send.send(open());});
        let worker=tokio::spawn(async move {receive.await.expect("detached opener disappeared")});'''
target = "command"
argv = ["cargo","nextest","run","--offline","--target","aarch64-apple-darwin","--lib","-E","test(an_expired_serial_opener_remains_owned_until_its_late_descriptor_is_dropped)"]
expect_text = "runtime forgot a still-running serial opener"

[[control]]
name = "timed_out_serial_open_is_retried"
file = "src/service/hat.rs"
anchor = "self.terminal = error.kind() == io::ErrorKind::TimedOut;"
replacement = "self.terminal = false;"
target = "command"
