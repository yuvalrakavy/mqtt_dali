[[control]]
name = "absolute_request_receives_a_new_window"
file = "src/atx/transactions/engine.rs"
anchor = '''    pub(crate) async fn execute_until(
        &self,
        command: Command,
        deadline: Instant,
        epoch: Option<(u64, u64)>,
    ) -> Result<Response, TransactionError> {
        if Instant::now() >= deadline {
            return Err(TransactionError::Deadline);
        }
        command
            .encode()
            .map_err(crate::atx::monitor::TransportError::from)?;
        terminal_count(&command, self.shared.repeat)?;
        self.enqueue_until(
            Operation::Command {
                command,
                initializing: false,
                epoch,
            },
            deadline,
        )
        .await
    }
'''
replacement = '''    pub(crate) async fn execute_until(
        &self,
        command: Command,
        deadline: Instant,
        epoch: Option<(u64, u64)>,
    ) -> Result<Response, TransactionError> {
        let _original = deadline;
        let deadline = Instant::now() + Duration::from_millis(20);
        if Instant::now() >= deadline {
            return Err(TransactionError::Deadline);
        }
        command
            .encode()
            .map_err(crate::atx::monitor::TransportError::from)?;
        terminal_count(&command, self.shared.repeat)?;
        self.enqueue_until(
            Operation::Command {
                command,
                initializing: false,
                epoch,
            },
            deadline,
        )
        .await
    }
'''
target = "command"
argv = ["cargo", "nextest", "run", "--offline", "--target", "aarch64-apple-darwin", "--lib", "-E", "test(an_expired_absolute_request_never_gets_a_fresh_submission_window)"]
expect_text = '''expired absolute request added a UART write'''

