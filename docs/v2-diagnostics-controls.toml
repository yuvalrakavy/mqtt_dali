[[control]]
name = "diagnostics_temperature_uses_signed_raw"
file = "src/dali/diagnostics.rs"
anchor = 'Kind::Temperature => Value::Number((raw.unwrap() as i64 - 60).to_string()),'
replacement = 'Kind::Temperature => Value::Number((raw.unwrap() as u8 as i8 as i64 - 60).to_string()),'
target = "command"
argv = ["cargo","nextest","run","--offline","--target","aarch64-apple-darwin","--lib","-E","test(diagnostics_maintenance_static)"]
expect_text = "Part253 numeric conversion changed"

[[control]]
name = "diagnostics_mask_meaning_is_guessed"
file = "src/dali/diagnostics.rs"
anchor = 'Some(raw) if raw == maximum => definition.mask,'
replacement = 'Some(raw) if raw == maximum => Status::ReadProtected,'
target = "command"
argv = ["cargo","nextest","run","--offline","--target","aarch64-apple-darwin","--lib","-E","test(diagnostics_reserved_values)"]
expect_text = "Part253 MASK/TMASK meaning changed"

[[control]]
