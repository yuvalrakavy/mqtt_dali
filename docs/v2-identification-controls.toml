[[control]]
name = "identification_forgets_prior_level"
file = "src/service/identification.rs"
anchor = "captured=Some((level,sample.stamp));"
replacement = "captured=Some((Level::new(0).unwrap(),sample.stamp));"
target = "command"
argv = ["cargo", "nextest", "run", "--offline", "--target", "aarch64-apple-darwin", "--lib", "-E", "test(identification_blinks_real_fixture)"]
expect_text = "Stop failed to restore captured actual level"

[[control]]
