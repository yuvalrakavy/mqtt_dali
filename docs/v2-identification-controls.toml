[[control]]
name = "identification_accepts_unstable_capture"
file = "src/service/identification.rs"
anchor = "        let Some(LevelValue::Known(level))=sample.level() else {return Err(ServiceError::Rejected(\"identification needs a known actual level\".into()))};\n        if sample.quality!=output::Quality::Current || !matches!(sample.status,Some(QueryReply::Value(QueryValue::Status(s))) if !s.fade_running()) {\n            return Err(ServiceError::Rejected(\"identification needs stable current output evidence\".into()))\n        }\n"
replacement = "        let level=Level::new(73).unwrap();\n"
target = "command"
argv = ["cargo", "nextest", "run", "--offline", "--target", "aarch64-apple-darwin", "--lib", "-E", "test(identification_capture_refuses_mask)"]
expect_text = "unknown or fading identification capture mutated the fixture"

