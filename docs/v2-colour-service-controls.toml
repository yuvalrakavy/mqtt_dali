# Each control mutates one guard and must fail a named behavior test.

[[control]]
name = "colour_known_gear_features_preflight_removed"
file = "src/service/output/colour.rs"
anchor = "if !matches!(self.gear_features, Some(Reply::Value(_))) {"
replacement = "if false {"
target = "command"
argv = ["cargo","nextest","run","--offline","--target","aarch64-apple-darwin","--lib","-E","test(colour_service_preflight_rejects)"]
expect_text = "invalid colour preflight reached mutation"

