[[control]]
name = "energy_decimal_uses_rounded_float"
file = "src/dali/energy.rs"
anchor = '(u128::from(raw) * 10_u128.pow(scale as u32)).to_string()'
replacement = 'format!("{:.0}", raw as f64 * 10_f64.powi(i32::from(scale)))'
target = "command"
argv = ["cargo","nextest","run","--offline","--target","aarch64-apple-darwin","--lib","-E","test(energy_data_maxima)"]
expect_text = "scaled decimal lost precision"

[[control]]
name = "energy_all_ff_becomes_tmask"
file = "src/dali/energy.rs"
anchor = '(Some(_), Some(raw)) if raw == maximum => Status::Invalid,'
replacement = '(Some(_), Some(raw)) if raw == maximum => Status::TemporarilyUnavailable,'
target = "command"
argv = ["cargo","nextest","run","--offline","--target","aarch64-apple-darwin","--lib","-E","test(energy_data_tmask)"]
expect_text = "energy MASK/TMASK semantics were guessed"

