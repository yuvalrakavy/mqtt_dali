[[control]]
name = "normal_closed_query_is_fatal_before_eof"
file = "src/service/hat.rs"
anchor = '''Done::Setup(Err(error)) | Done::Poll(Err(error)) => {
                if error == TransactionError::Closed && !self.closing {
                    self.begin_close();
                    return Ok(());
                }'''
replacement = '''Done::Setup(Err(error)) | Done::Poll(Err(error)) => {
                if error == TransactionError::Closed && !self.closing {
                    return Err("unexplained closed query".into());
                }'''
target = "command"
argv = ["cargo","nextest","run","--offline","--target","aarch64-apple-darwin","--lib","-E","test(closed_query_before_public_eof_joins_transport_before_retry)"]
expect_text = "normal EOF became fatal before public closure delivery"

