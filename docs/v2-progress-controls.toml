# P4b2 scheduling and closure-ordering guard-removal controls.

[[control]]
name = "input_precedes_queued_request_retirement"
file = "src/atx/transactions/engine.rs"
anchor = '''_ = stop_requested(&mut self.stop) => return,
                request = self.requests.recv() => {
                    let Some(mut request) = request else { return; };
                    let result = self.request(&mut request).await;
                    self.publish_mode();
                    let Request { reply, permit, .. } = request;
                    drop(permit); // Retire admission before waking the caller.
                    let _ = reply.send(result);
                },
                event = self.events.recv() => { self.idle_event(event); self.publish_mode(); },'''
replacement = '''_ = stop_requested(&mut self.stop) => return,
                event = self.events.recv() => { self.idle_event(event); self.publish_mode(); },
                request = self.requests.recv() => {
                    let Some(mut request) = request else { return; };
                    let result = self.request(&mut request).await;
                    self.publish_mode();
                    let Request { reply, permit, .. } = request;
                    drop(permit);
                    let _ = reply.send(result);
                },'''
target = "command"
argv = ["cargo","nextest","run","--offline","--target","aarch64-apple-darwin","--lib","-E","test(canceled_and_expired_queued_callers_retire_under_continuous_input)"]
expect_text = "continuous input stranded a canceled or expired request's admission permit"

[[control]]
