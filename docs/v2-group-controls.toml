[[control]]
name = "groups_assignment_overwrites_unselected_physical_bits"
file = "src/service/groups.rs"
anchor = "Action::Assign { group, member } => frames::Mask(mask).with(group, member).0,"
replacement = "Action::Assign { .. } => desired,"
target = "command"
argv = ["cargo","nextest","run","--offline","--target","aarch64-apple-darwin","--lib","-E","test(group_assignment_saves)"]
expect_text = "assignment cleared unselected hardware group bits"

