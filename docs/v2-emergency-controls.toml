[[control]]
name = "emergency_saturated_total_counter_is_lost"
file = "src/dali/emergency.rs"
anchor = 'Self::TotalHours => Value::Known(value * 4),'
replacement = 'Self::TotalHours if raw == 255 => Value::Unknown, Self::TotalHours => Value::Known(value * 4),'
target = "command"
argv = ["cargo","nextest","run","--offline","--target","aarch64-apple-darwin","--lib","-E","test(emergency_ff_is_query_specific_and_counters_saturate)"]
expect_text = "emergency_ff_is_query_specific_and_counters_saturate"

