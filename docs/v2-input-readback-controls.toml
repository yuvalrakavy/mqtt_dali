# Exact values, freshness and shared ownership. Run sequentially; restore per row.

[[control]]
name = "emulator_latch_changes_with_live_input"
file = "src/emulator/input.rs"
anchor = "value.bytes = bytes;"
replacement = "if let Some((latched,_))=self.latches.get_mut(&instance) { *latched=bytes.clone(); }\n        value.bytes = bytes;"
target = "command"
argv = ["cargo","nextest","run","--offline","--target","aarch64-apple-darwin","--lib","-E","test(literal_input_queries_latch)"]
expect_text = "latch read a newer sample instead of the captured value"

[[control]]
name = "input_padding_is_kept_as_measurement_bits"
file = "src/dali/input/value.rs"
anchor = "let shift = (8 - resolution.bits() % 8) % 8;"
replacement = "let shift = 0;"
target = "command"
argv = ["cargo","nextest","run","--offline","--target","aarch64-apple-darwin","--lib","-E","test(full_input_values_keep_literal)"]
expect_text = "full input value lost significant bits or kept padding"

[[control]]
name = "input_width_is_limited_to_64_bits"
file = "src/dali/input/value.rs"
anchor = "usize::from(self.0).div_ceil(8)"
replacement = "usize::from(self.0).div_ceil(8).min(8)"
target = "command"
argv = ["cargo","nextest","run","--offline","--target","aarch64-apple-darwin","--lib","-E","test(full_input_values_keep_literal)"]
expect_text = "called `Result::unwrap()` on an `Err` value: Length"

