# P4d4 automatic activation and combined-output behavior controls.

[[control]]
name = "known_automatic_activation_is_rejected"
file = "src/service/output/colour.rs"
anchor = "if !matches!(self.gear_features, Some(Reply::Value(_))) {"
replacement = "if !matches!(self.gear_features, Some(Reply::Value(raw)) if raw & 1 == 0) {"
target = "command"
argv = ["cargo","nextest","run","--offline","--target","aarch64-apple-darwin","--lib","-E","test(colour_service_known_automatic)"]
expect_text = "known automatic activation was rejected"

[[control]]
name = "combined_off_classification_is_lost"
file = "src/dali/gear.rs"
anchor = "matches!(self.0, Drive::Off) || matches!(self.0, Drive::Level(level) if level.raw() == 0)"
replacement = "false"
target = "command"
argv = ["cargo","nextest","run","--offline","--target","aarch64-apple-darwin","--lib","-E","test(colour_service_combined_orders)"]
expect_text = "combined power/colour frame order is incorrect"

[[control]]
