[[control]]
name = "browser_unwraps_inventory"
file = "web/src/client.ts"
anchor = "inventory:value.inventory.Inventory"
replacement = "inventory:value.inventory"
target = "command"
argv = ["node", "--test", "--test-timeout=2000", "--test-name-pattern=browser unwraps", "web/src/client.test.ts"]
expect_text = "published Inventory envelope was not decoded"

