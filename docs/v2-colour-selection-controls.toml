# Durable selection, generation fencing and independently replayed identity.

[[control]]
name = "producer_omits_color_contract_from_projection"
file = "src/inventory/ledger.rs"
anchor = ".color_representation\n                } else {"
replacement = ".color_representation.filter(|_| false)\n                } else {"
target = "command"
argv = ["cargo","nextest","run","--offline","--target","aarch64-apple-darwin","--lib","-E","test(color_selection_rotates_only_contract)"]
expect_text = "color selection missing from identity projection"

[[control]]
name = "producer_reuses_color_contract_generation"
file = "src/inventory/edit.rs"
anchor = "&& before.color_representation == projection.color_representation"
replacement = "&& true"
target = "command"
argv = ["cargo","nextest","run","--offline","--target","aarch64-apple-darwin","--lib","-E","test(color_selection_rotates_only_contract)"]
expect_text = "color selection kept old request generation"

[[control]]
name = "producer_accepts_past_group_color_contract"
file = "src/inventory/ledger.rs"
anchor = "&& projection.color_representation.is_none()\n        }\n        Location::Input {"
replacement = "&& true\n        }\n        Location::Input {"
target = "command"
argv = ["cargo","nextest","run","--offline","--target","aarch64-apple-darwin","--lib","-E","test(color_selection_rejects_non_output_metadata_even_in_past_history)"]
expect_text = "past non-output color projection was accepted"

[[control]]
name = "consumer_accepts_past_group_color_contract"
file = "tests/support/inventory_consumer.rs"
anchor = "&& record.color_representation.is_none()\n            }\n            Location::Input {"
replacement = "&& true\n            }\n            Location::Input {"
target = "command"
argv = ["cargo","nextest","run","--offline","--target","aarch64-apple-darwin","--test","inventory_contract","-E","test(color_selection_consumer_rejects_wrong_space_even_in_past_history)"]
expect_text = "consumer accepted past non-output color projection"

[[control]]
name = "consumer_carries_old_color_intent_through_rename"
file = "tests/support/inventory_consumer.rs"
anchor = "|| from.color_representation != to.color_representation"
replacement = "|| false"
target = "command"
argv = ["cargo","nextest","run","--offline","--target","aarch64-apple-darwin","--test","inventory_contract","-E","test(color_selection_consumer_drops_intent_even_when_fixture_is_also_renamed)"]
expect_text = "rename carried incompatible color intent"

[[control]]
name = "consumer_accepts_current_color_without_history"
file = "tests/support/inventory_consumer.rs"
anchor = "if representation\n                    != serde_json::to_value(record.color_representation)\n                        .map_err(|e| e.to_string())?"
replacement = "if false"
target = "command"
argv = ["cargo","nextest","run","--offline","--target","aarch64-apple-darwin","--test","inventory_contract","-E","test(color_selection_consumer_rejects_unrecorded_or_wrong_space_metadata)"]
expect_text = "malformed color history accepted"

[[control]]
name = "color_command_uses_controller_generation"
file = "src/service/routing.rs"
anchor = "table.targets[&projection.target].clone()"
replacement = "table.instance"
target = "command"
argv = ["cargo","nextest","run","--offline","--target","aarch64-apple-darwin","--lib","-E","test(mqtt_color_selection_is_durable)"]
expect_text = "color selection used controller token instead of output token"

[[control]]
name = "missing_color_selection_silently_clears_contract"
file = "src/service/proxy.rs"
anchor = "if !call.params.contains_key(\"color_representation\") {"
replacement = "if false {"
target = "command"
argv = ["cargo","nextest","run","--offline","--target","aarch64-apple-darwin","--lib","-E","test(mqtt_color_selection_is_durable)"]
expect_text = "invalid color selection committed"

[[control]]
name = "color_contract_accepts_tagged_objects"
file = "src/config.rs"
anchor = "let name = String::deserialize(deserializer)?;"
replacement = "let name = match serde_json::Value::deserialize(deserializer)? {\nserde_json::Value::String(name) => name,\nserde_json::Value::Object(map) => map.into_iter().next().map(|(key, _)| key).unwrap_or_default(),\n_ => String::new() };"
target = "command"
argv = ["cargo","nextest","run","--offline","--target","aarch64-apple-darwin","--lib","-E","test(color_selection_rejects_unknown_formats)"]
expect_text = "invalid public color selection accepted"

[[control]]
name = "consumer_ignores_current_input_color_contract"
file = "tests/support/inventory_consumer.rs"
anchor = "if input\n                    .get(\"color_representation\")\n                    .is_some_and(|v| !v.is_null())"
replacement = "if false"
target = "command"
argv = ["cargo","nextest","run","--offline","--target","aarch64-apple-darwin","--test","inventory_contract","-E","test(color_selection_consumer_rejects_current_input)"]
expect_text = "non-output current color selection accepted, instance=false"

[[control]]
name = "consumer_ignores_current_instance_color_contract"
file = "tests/support/inventory_consumer.rs"
anchor = "if instance\n                        .get(\"color_representation\")\n                        .is_some_and(|v| !v.is_null())"
replacement = "if false"
target = "command"
argv = ["cargo","nextest","run","--offline","--target","aarch64-apple-darwin","--test","inventory_contract","-E","test(color_selection_consumer_rejects_current_input)"]
expect_text = "non-output current color selection accepted, instance=true"
