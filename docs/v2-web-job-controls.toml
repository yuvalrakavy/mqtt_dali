[[control]]
name = "web_jobs_skip_post_body_authentication"
file = "src/web/handlers.rs"
anchor = '''    if !state
        .auth'''
replacement = '''    if false && !state
        .auth'''
target = "command"
argv = ["cargo","nextest","run","--offline","--target","aarch64-apple-darwin","--lib","-E","test(web_jobs_authentication_csrf)"]
expect_text = "session revoked during body upload admitted a command"

