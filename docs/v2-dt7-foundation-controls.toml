[[control]]
name = "dt7_direction_only_checks_crossed_thresholds"
file = "src/emulator/switching.rs"
anchor = "    pub fn drive(&mut self, level: u8) {\n        if level == self.virtual_level {\n            return;\n        }\n        let up = level > self.virtual_level;\n        self.virtual_level = level;\n        let on_index = if up { 0 } else { 2 };\n        let off_index = on_index + 1;\n        let on = self.profile.thresholds[on_index];\n        let off = self.profile.thresholds[off_index];\n        let applies = |threshold| {\n            threshold != 255\n                && if up {\n                    level >= threshold\n                } else {\n                    level <= threshold\n                }\n        };\n        let on_applies = applies(on);\n        let off_applies = applies(off);\n        // Last applicable threshold in the direction of travel wins; ties are On.\n        // Evaluate the new direction even when its threshold lies before old VAPL.\n        if on_applies && (!off_applies || if up { on >= off } else { on <= off }) {\n            self.on = true;\n            self.last_threshold = Some(on_index as u8);\n        } else if off_applies {\n            self.on = false;\n            self.last_threshold = Some(off_index as u8);\n        }\n    }"
replacement = "    pub fn drive(&mut self, level: u8) {\n        if level == self.virtual_level {\n            return;\n        }\n        let old = self.virtual_level;\n        let up = level > self.virtual_level;\n        self.virtual_level = level;\n        let on_index = if up { 0 } else { 2 };\n        let off_index = on_index + 1;\n        let on = self.profile.thresholds[on_index];\n        let off = self.profile.thresholds[off_index];\n        let applies = |threshold| {\n            threshold != 255\n                && if up {\n                    level >= threshold && old < threshold\n                } else {\n                    level <= threshold && old > threshold\n                }\n        };\n        let on_applies = applies(on);\n        let off_applies = applies(off);\n        // Last applicable threshold in the direction of travel wins; ties are On.\n        // Evaluate the new direction even when its threshold lies before old VAPL.\n        if on_applies && (!off_applies || if up { on >= off } else { on <= off }) {\n            self.on = true;\n            self.last_threshold = Some(on_index as u8);\n        } else if off_applies {\n            self.on = false;\n            self.last_threshold = Some(off_index as u8);\n        }\n    }"
target = "command"
argv = ["cargo", "nextest", "run", "--offline", "--target", "aarch64-apple-darwin", "--lib", "-E", "test(literal_dt7_direction_reversal)", "--status-level", "fail", "--final-status-level", "fail"]
expect_text = "DT7 direction reversal or last applicable threshold was ignored"

