# Run sequentially. Each command must fail at its behavioral assertion.

[[control]]
name = "unchanged_clamped_readback_is_not_reported_before_ack"
file = "src/service/proxy.rs"
anchor = '''        self.reporter
            .as_ref()
            .ok_or_else(|| OpError::Link(LinkError::new("proxy is disconnected")))?
            .state_with_context(target, state.state.values, false, &state.context);'''
replacement = "        let _ = state;"
target = "command"
argv = ["cargo", "nextest", "run", "--offline", "--target", "aarch64-apple-darwin", "--lib", "-E", "test(unchanged_clamped_readback_precedes_ack_and_remains_the_reconnect_basis)"]
expect_text = "unchanged actual readback was replaced by inferred intent before ack"

