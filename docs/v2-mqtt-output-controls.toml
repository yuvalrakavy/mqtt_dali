[[control]]
name = "helper_local_cache_hides_a_physical_return"
file = "src/service/proxy/state.rs"
anchor = '''    pub(super) async fn run(mut self) {
        loop {
            let snapshot = self.snapshots.borrow_and_update().clone();
            if let Some(snapshot) = snapshot {
                for state in projections(&snapshot) {'''
replacement = '''    pub(super) async fn run(mut self) {
        let mut previous = std::collections::BTreeMap::new();
        loop {
            let snapshot = self.snapshots.borrow_and_update().clone();
            if let Some(snapshot) = snapshot {
                for state in projections(&snapshot) {
                    if previous.get(&state.state.target) == Some(&state.state.values) {
                        continue;
                    }
                    previous.insert(state.state.target.clone(), state.state.values.clone());'''
target = "command"
argv = ["cargo", "nextest", "run", "--offline", "--target", "aarch64-apple-darwin", "--lib", "-E", "test(snapshot_helper_cannot_skip_a_return_to_its_previous_value_after_driver_readback)"]
expect_text = "helper's private projection cache hid a newer physical return to its previous value"

