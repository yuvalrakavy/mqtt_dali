[[control]]
name = "restore_input_recreates_lifetimes"
file = "src/inventory/edit.rs"
anchor = "                origins.insert(new, origin);"
replacement = "                let _=origin; fresh(origins,new,revision);"
target = "command"
argv = ["cargo", "nextest", "run", "--offline", "--target", "aarch64-apple-darwin", "--lib", "-E", "test(input_readdress_preserves)", "--test-threads", "4"]
expect_text = "input address change replaced a continuing lifetime"

[[control]]
name = "restore_skips_confirmed_save"
file = "src/service/owner/restoration_changes.rs"
anchor = "                let accepted =\n                    self.accept_save(service, outcome, q.completion.as_ref(), &q.context)?;"
replacement = "                let _=outcome; let accepted=service.handle.snapshot().unwrap();"
target = "command"
argv = ["cargo", "nextest", "run", "--offline", "--target", "aarch64-apple-darwin", "--lib", "-E", "test(restoration_failed_or_uncertain)", "--test-threads", "4"]
expect_text = "unconfirmed candidate retirement was accepted"

[[control]]
name = "restore_releases_permit_during_save"
file = "src/service/owner/restoration_changes.rs"
anchor = "                service.update_snapshot(self.model.clone(), Phase::Writing);"
replacement = "                let fake=Arc::new(Semaphore::new(1)).try_acquire_owned().unwrap();\n                drop(std::mem::replace(&mut q._permit,fake));\n                service.update_snapshot(self.model.clone(), Phase::Writing);"
target = "command"
argv = ["cargo", "nextest", "run", "--offline", "--target", "aarch64-apple-darwin", "--lib", "-E", "test(restoration_held_save)", "--test-threads", "4"]
expect_text = "candidate retirement released the physical permit"

