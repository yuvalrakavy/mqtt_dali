[[control]]
name = "web_protected_router_omits_authentication"
file = "src/web/handlers.rs"
anchor = ".layer(middleware::from_fn_with_state(state.clone(), protect));"
replacement = ";"
target = "command"
argv = ["cargo","nextest","run","--offline","--target","aarch64-apple-darwin","--lib","-E","test(web_http_protects_direct_urls)"]
expect_text = "direct protected API bypassed authentication"

