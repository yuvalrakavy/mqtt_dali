[[control]]
name = "reassignment_skips_durable_activation"
file = "src/service/owner/reassignment_changes.rs"
anchor = "        let accepted = self.accept_save(\n            service,\n            outcome,\n            request.completion.as_ref(),\n            &request.context,\n        )?;"
replacement = "        let _ = outcome;\n        let accepted=service.handle.snapshot().unwrap();"
target = "command"
argv = ["cargo", "nextest", "run", "--offline", "--target", "aarch64-apple-darwin", "--lib", "-E", "test(reassignment_save_failure_or_uncertainty)"]
expect_text = "unconfirmed reassignment save was accepted"

[[control]]
name = "reassignment_releases_permit_during_save"
file = "src/service/owner/reassignment_changes.rs"
anchor = "        service.update_snapshot(self.model.clone(), Phase::Writing);"
replacement = "        let fake=Arc::new(Semaphore::new(1)).try_acquire_owned().unwrap();\n        drop(std::mem::replace(&mut request._permit,fake));\n        service.update_snapshot(self.model.clone(), Phase::Writing);"
target = "command"
argv = ["cargo", "nextest", "run", "--offline", "--target", "aarch64-apple-darwin", "--lib", "-E", "test(reassignment_save_failure_or_uncertainty)"]
expect_text = "reassignment save released physical permit"

