# --- Stopping (finding C-7) and a session that blocks synchronously (finding C-34).

[[control]]
name        = "the_session_blocks_synchronously"
# Not a guard removed but the hazard planted: a session stuck in a synchronous call. The
# saturation test must come back RED by its own deadlines. (Its single-task predecessor, with the
# session polled inside the test's select!, HUNG under this same mutation: the failing-first run.)
file        = "src/mqtt.rs"
anchor      = '''                                DaliCommand::UpdateBusStatus => self.update_bus_status(),'''
replacement = '''                                DaliCommand::UpdateBusStatus => { std::thread::sleep(Duration::from_secs(3600)); self.update_bus_status() }'''
