argv        = ["cargo", "test", "-q", "--target", "aarch64-apple-darwin", "--bin", "mqtt_dali", "--", "a_command_burst_against_a_stalled_broker_completes_once_it_recovers"]
expect_text = "config publishes arrived after the broker recovered"
guard       = "saturation_test_bounded"

