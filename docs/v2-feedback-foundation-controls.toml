# Serial intentional faults; restore each before the next row or source review.
[[control]]
name = "feedback_codec_aliases_input_selector"
file = "src/dali/input/feedback.rs"
anchor = "Scope::Instance(i) => 0x20 | i.raw(),"
replacement = "Scope::Instance(i) => i.raw(),"
target = "command"
argv = ["cargo","nextest","run","--offline","--target","aarch64-apple-darwin","--lib","-E","test(feature_feedback_literal_frames)"]
expect_text = "feedback frame selector/opcode changed"

