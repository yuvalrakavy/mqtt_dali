[[control]]
name = "aggregate_refresh_reports_input_snapshot_from_before_await"
file = "src/service/proxy.rs"
anchor = "state::projections(&latest)"
replacement = "state::projections(&snapshot)"
target = "command"
argv = ["cargo","nextest","run","--offline","--target","aarch64-apple-darwin","--lib","-E","test(live_input_state_changed_during_all_refresh_is_projected_after_the_last_await)"]
expect_text = "aggregate refresh overwrote a newer input with its old snapshot"

[[control]]
name = "mqtt_double_press_is_changed_to_short_press"
file = "src/service/input.rs"
