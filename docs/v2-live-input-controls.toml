replacement = "ButtonAction::DoublePress => \"short_press\","
target = "command"
argv = ["cargo","nextest","run","--offline","--target","aarch64-apple-darwin","--lib","-E","test(live_input_actions_are_native_and_never_coalesced_into_one_snapshot)"]
