[[control]]
name = "input_pair_renews_its_deadline"
file = "src/service/commissioning.rs"
anchor = ".min(Instant::now() + Duration::from_millis(100))"
replacement = ".min(Instant::now() + Duration::from_millis(500))"
target = "command"
argv = ["cargo","nextest","run","--offline","--target","aarch64-apple-darwin","--lib","-E","test(input_assignment_pair_uses_one_deadline)"]
expect_text = "input pair renewed the 100 ms deadline"

