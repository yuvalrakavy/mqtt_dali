[[control]]
name = "search_excludes_random_address_zero"
file = "src/service/commissioning.rs"
anchor = "let (mut low, mut high) = (0u32, 0xffffffu32);"
replacement = "let (mut low, mut high) = (1u32, 0xffffffu32);"
target = "command"
argv = ["cargo","nextest","run","--offline","--target","aarch64-apple-darwin","--lib","-E","test(commissioning_literal_search)"]
expect_text = "inclusive search missed a valid boundary"

