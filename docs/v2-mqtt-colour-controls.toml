target = "command"
argv = ["cargo","nextest","run","--offline","--target","aarch64-apple-darwin","--lib","-E","test(partial_xy_plans)"]
expect_text = "partial xy did not overwrite the omitted X with MASK"

[[control]]
name = "partial_xy_unspecified_y_becomes_zero"
file = "src/dali/colour.rs"
