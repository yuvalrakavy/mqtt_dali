# Selected-family MQTT requests and actual/capability State boundaries.

[[control]]
name = "mixed_color_family_is_silently_ignored"
file = "src/service/proxy/colour.rs"
anchor = "if values.contains_key(field) && !belongs(query, representation) {"
replacement = "if false {"
target = "command"
argv = ["cargo","nextest","run","--offline","--target","aarch64-apple-darwin","--lib","-E","test(mqtt_colour_invalid_combined)"]
expect_text = "invalid complete color request partially changed base power"

[[control]]
name = "combined_mqtt_map_discards_color"
file = "src/service/proxy.rs"
anchor = ".apply_colour_with_output(target, colour, base, context.clone(), deadline)"
replacement = ".apply_output(target, base, context.clone(), deadline)"
target = "command"
argv = ["cargo","nextest","run","--offline","--target","aarch64-apple-darwin","--lib","-E","test(mqtt_colour_first_refresh_discovers)"]
expect_text = "selected-family MQTT color state never became current"

[[control]]
name = "color_only_mqtt_map_invents_power_on"
file = "src/service/proxy.rs"
anchor = ".apply_colour(target, colour, context.clone(), deadline)"
replacement = ".apply_colour_with_output(\ntarget, colour, crate::dali::gear::Intent::new(Some(true),None).unwrap(), context.clone(), deadline\n)"
target = "command"
argv = ["cargo","nextest","run","--offline","--target","aarch64-apple-darwin","--lib","-E","test(mqtt_colour_scalar_xy)"]
expect_text = "color-only xy changed master brightness"

[[control]]
name = "partial_xy_unspecified_x_becomes_zero"
file = "src/dali/colour.rs"
anchor = "x.map_or(65535, Coordinate::raw)"
