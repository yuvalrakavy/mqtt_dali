replacement = "y.map_or(0, Coordinate::raw)"
target = "command"
argv = ["cargo","nextest","run","--offline","--target","aarch64-apple-darwin","--lib","-E","test(partial_xy_plans)"]
expect_text = "partial xy did not overwrite the omitted Y with MASK"

[[control]]
name = "mqtt_merged_color_values_are_not_cleared"
file = "src/service/proxy/colour.rs"
anchor = "values.insert(field.into(), actual.map(Value::from).unwrap_or(Value::Null));"
replacement = "if let Some(actual) = actual { values.insert(field.into(), Value::from(actual)); }"
target = "command"
argv = ["cargo","nextest","run","--offline","--target","aarch64-apple-darwin","--lib","-E","test(mqtt_colour_bus_invalidation)"]
expect_text = "stale MQTT color data survived merged State invalidation"

