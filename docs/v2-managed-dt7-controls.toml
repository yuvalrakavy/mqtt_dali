# Run serially, then restore source/assets before freeze and readers.

[[control]]
name = "managed_dt7_missing_positive_type_is_unsupported"
file = "src/service/output/settings/switching.rs"
anchor = "Some(7) => Some(true),"
replacement = "Some(7) => Some(false),"
target = "command"
argv = ["cargo", "nextest", "run", "--offline", "--target", "aarch64-apple-darwin", "--lib", "-E", "test(managed_dt7_settings_native_thresholds)", "--status-level", "fail", "--final-status-level", "fail"]
expect_text = "managed DT7 thresholds were not confirmed"

