[package]
name = "mqtt_dali"
version = "2.0.0-dev.0"
edition = "2021"
default-run = "mqtt_dali_v2"

build = "build.rs"

[[bin]]
name = "mqtt_dali_v1"
path = "src/legacy_main.rs"

[features]
# Explicit test build only; shared kit additionally requires MQTT_BRIDGE_TEST_SEAMS=1.
process-test-seams = ["mqtt-bridge-kit/test-seams"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
thiserror = "2.0.3"
error-stack = "0.6.0"

# serde_json is just for the example, not required in general
tokio = { version="1.41.1", features = ["full"]}
serde_json = "1.0.133"
serde = { version = "1.0.215", features = ["derive"] }
#rumqttc = { path="../../rumqtt/rumqttc" }
rumqttc = { version = "0.25.1", default-features = false }
rustop = "1.1.4"
rand = "0.10.0"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
sha2 = "0.10.9"
subtle = "2.6.1"
futures-util = "0.3.31"
tokio-util = { version = "0.7.12", features = ["rt"] }
libc = "0.2"
tracing = { version = "0.1.41"  }
log = "0.4.22"
tracing-init = { git="http://github.com/yuvalrakavy/tracing-init.git", rev="d83fa224bf04216dcde4be4102b1b2dc98fd7010", features = ["otel"] }
mqtt-bridge-kit = { git="http://github.com/yuvalrakavy/tracing-init.git", rev="d83fa224bf04216dcde4be4102b1b2dc98fd7010" }
built = "0.8.0" 

# to run with logging use
#  RUST_LOG=trace,rumqttc=off mqtt_dali ...

regex = "1.11.1"

# The DALI hardware (the Pi's UART) is Linux-only; elsewhere the bridge runs with --emulation,
# which is also how its tests run on a development Mac.
[target.'cfg(target_os = "linux")'.dependencies]
rppal = "0.22.1"

[build-dependencies]
built = { version= "0.8.0", features = ["chrono"] }

[dev-dependencies]
tokio = { version = "1.41.1", features = ["test-util"] }
# The fleet's test tools, from the same repository as tracing-init (one revision for all three).
wait-lint = { git="http://github.com/yuvalrakavy/tracing-init.git", rev="d83fa224bf04216dcde4be4102b1b2dc98fd7010" }
mqtt-test-broker = { git="http://github.com/yuvalrakavy/tracing-init.git", rev="d83fa224bf04216dcde4be4102b1b2dc98fd7010" }
